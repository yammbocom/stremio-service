# Yammbo TV Service — Windows build (rebranded fork of stremio-service)
name: Yammbo Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Yammbo icons & wizard images
        shell: bash
        run: |
          set -e
          # App / installer icon (multi-resolution .ico) from the 512px Yammbo icon
          magick branding/yambo-icon-512.png -define icon:auto-resize=256,128,64,48,32,16 resources/service.ico
          magick branding/yambo-icon-512.png -define icon:auto-resize=256,128,64,48,32,16 resources/runtime.ico
          # Tray icon
          magick branding/yambo-icon-512.png -resize 256x256 icons/icon.png
          # Wizard images: black canvas + centered Yammbo icon (match original BMP sizes)
          magick branding/yambo-icon-512.png -resize 130x130 /tmp/ic_big.png
          magick -size 164x314 xc:black /tmp/ic_big.png -gravity center -composite -type truecolor BMP3:setup/windows-installer.bmp
          magick branding/yambo-icon-512.png -resize 48x48 /tmp/ic_small.png
          magick -size 57x57 xc:black /tmp/ic_small.png -gravity center -composite -type truecolor BMP3:setup/windows-installer-header.bmp

      - name: Build (bundled)
        run: cargo build --release --features=bundled

      - name: Patch server.js CORS whitelist for yammbo.com
        shell: bash
        run: node patch-server-cors.js

      - name: Stage exe for the installer
        shell: bash
        run: |
          set -e
          mkdir -p stremio-service-windows
          cp target/release/stremio-service.exe stremio-service-windows/stremio-service.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup/StremioService.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YammboTVServiceSetup
          path: YammboTVServiceSetup.exe
          if-no-files-found: error
